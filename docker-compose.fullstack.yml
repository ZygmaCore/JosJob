# Local dev / preview: Postgres + Elixir backend + unified Flutter-web app.
#
#   docker compose --env-file envs/.env up -d --build
#     paradedb  (Postgres/ParadeDB)     -> localhost:5438
#     stellar_be (Elixir/Phoenix API)   -> http://localhost:4000
#     stellar_fe (Flutter web, unified) -> http://localhost:8081
#
# The backend runs in a Linux/glibc container on purpose: the xberg Rust NIF has
# no Windows-MSVC precompiled binary (and is force-built from source), so it
# won't `mix compile` on a native Windows box — the container sidesteps that.
# See the root Dockerfile header for details.
#
# The FE bakes API_BASE_URL at build time; to talk to THIS local backend it must
# be http://localhost:4000 (the compose default). If your root .env points it at
# a remote backend, override it and rebuild: `API_BASE_URL=http://localhost:4000
# docker compose up -d --build stellar_fe`.

services:
  paradedb:
    image: paradedb/paradedb:latest
    container_name: paradedb
    # Kredensial dari POSTGRES_* (satu sumber). Agar terbaca dari envs/.env:
    #   docker compose --env-file envs/.env up -d paradedb
    # Tanpa --env-file, memakai default di bawah (cocok dengan default runtime.exs).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stellar_dev}
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - paradedb_data:/var/lib/postgresql/
    # Gate the backend's startup (migrate/seed) until Postgres actually accepts
    # connections — depends_on: condition: service_healthy waits on this.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stellar_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # Backend (Elixir umbrella) — Phoenix JSON API as an OTP release. Built from
  # the root Dockerfile (Debian/glibc so the xberg Rust NIF + C NIFs build/run;
  # see the Dockerfile header). Runs migrations + idempotent seed on boot, then
  # serves on :4000. Reads optional integration creds (Google/Stripe/Cloudflare)
  # from envs/.env; DB + secrets below override anything there.
  #
  #   docker compose --env-file envs/.env up -d --build stellar_be
  #     API -> http://localhost:4000   (point the FE's API_BASE_URL here)
  stellar_be:
    build:
      context: .
      dockerfile: Dockerfile
    image: stellar-be:local
    depends_on:
      paradedb:
        condition: service_healthy
    env_file:
      - path: envs/.env
        required: false
    environment:
      # HTTP endpoint (runtime.exs).
      PORT: "4000"
      PHX_HOST: localhost
      PHX_SERVER: "true"
      # DB — reach paradedb over the compose network on 5432 (the 5438 mapping is
      # host-only). Creds mirror the paradedb service defaults above.
      POSTGRES_HOST: paradedb
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stellar_dev}
      # Secrets — LOCAL DEV ONLY (prod injects real ones via envs/.env or CI).
      # runtime.exs raises without these in :prod.
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-Y0gF2tQz9eje//pqz7zcdkgV1vfWQnoemQowVep17A1GPIZeAIRMteuO1TxmPd0O}"
      TOKEN_SIGNING_SECRET: "${TOKEN_SIGNING_SECRET:-0GztbbNXgLZZEG9FbXb/OYEH9VYwRmMUqyZ3g5L5b9I/7aNXJopG6BF/RFW1HMyD}"
      # The FE calls /api cross-origin; cors_plug handles CORS. check_origin only
      # gates websockets/LiveView — relax it for local so nothing is refused.
      CHECK_ORIGIN: "false"
    ports:
      - "4000:4000"
    restart: unless-stopped

  stellar_fe:
    build:
      context: ./apps/stellar_fe
      # Baked into the web bundle at BUILD time (Dart String.fromEnvironment).
      # Substituted from the root .env (auto-loaded) or envs/.env via:
      #   docker compose --env-file envs/.env up --build
      # Without either they fall back to localhost/empty defaults, so Google
      # sign-in shows "coming soon" until a real GOOGLE_CLIENT_ID is given.
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: stellar-fe:local
    ports:
      - "8081:8080" # host 8081 -> nginx 8080 in the container
    restart: unless-stopped

volumes:
  paradedb_data:
