<body>
  <noscript>
    <main>
      <h1>JosJob: job discovery and online learning in Indonesia</h1>
      <p>Your degree is a start. Build what comes next. JosJob brings job discovery and online learning together for fresh graduates, final-year students and career builders.</p>
      <h2>Find your direction. Build skills for your next role.</h2>
      <p>Explore job listings and courses today. Job access is free for graduates; course pricing varies.</p>
      <h2>Our vision: match, find the gap, learn, match again</h2>
      <p>AI CV extraction, ranked role matches, skill-gap explanations, connected learning paths and re-matching are planned features.</p>
      <p>Employers can publish job opportunities. Instructors and institutions support learning through courses and classes.</p>
      <p>Enable JavaScript to create your account and explore JosJob.</p>
